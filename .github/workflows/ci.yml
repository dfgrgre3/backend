name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: thanawy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then echo "Files need gofmt:"; gofmt -s -l .; exit 1; fi

    # staticcheck — stricter than go vet, catches common bugs vet misses
    # (e.g. unused result, wrong printf verb, suspicious lock usage).
    # Install pinned version for reproducibility; bump quarterly.
    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
        staticcheck ./...

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: '1.26'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/thanawy_test?sslmode=disable
        REDIS_URL: redis://localhost:6379
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install swag CLI
      run: go install github.com/swaggo/swag/cmd/swag@latest

    # Regenerate swagger spec from handler annotations. Output goes
    # to docs/ which is the package imported by main.go (see
    # internal/bootstrap/bootstrap_router.go). The frontend CI consumes
    # docs/swagger.json via the artifact uploaded below.
    - name: Regenerate swagger spec
      run: swag init -g cmd/api/main.go -o docs --parseDependency --parseInternal

    - name: Build
      run: go build -v ./cmd/api

    # Publish the swagger artifact so the frontend repo can pin its
    # generated TS types against this exact spec. Workflow consumers
    # must use `actions/download-artifact` with `name: backend-swagger`.
    - name: Upload swagger artifact
      uses: actions/upload-artifact@50769540e7f4c5e42452ba3ad26393d1f73f7b6e # v4.4.0
      with:
        name: backend-swagger
        path: docs/swagger.json
        if-no-files-found: error
        retention-days: 14
