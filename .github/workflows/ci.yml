name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: thanawy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then echo "Files need gofmt:"; gofmt -s -l .; exit 1; fi

    # staticcheck — stricter than go vet, catches common bugs vet misses
    # (e.g. unused result, wrong printf verb, suspicious lock usage).
    # Install pinned version for reproducibility; bump quarterly.
    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
        staticcheck ./...

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: '1.26'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/thanawy_test?sslmode=disable
        REDIS_URL: redis://localhost:6379
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  build:
    runs-on: ubuntu-latest
    needs: test
    # Minimal, job-scoped grant: publishing the swagger-latest Release needs
    # `contents: write`. The `test` job must NOT inherit this permission.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    # Install swag CLI pinned to the exact version in go.mod. A moving
    # @latest would make the drift check below non-deterministic (different
    # swag versions can emit slightly different spec formatting).
    - name: Install swag CLI (pinned to go.mod version)
      run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

    # Regenerate swagger spec from handler annotations. Output goes
    # to docs/ which is the package imported by main.go (see
    # internal/bootstrap/bootstrap_router.go). The freshly generated
    # docs/swagger.json is published below as the `swagger-latest`
    # Release asset consumed by the frontend CI.
    - name: Regenerate swagger spec
      run: swag init -g cmd/api/main.go -o docs --parseDependency --parseInternal

    # Drift guard: the committed docs/swagger.json must already match what
    # swag generates from the current handler annotations. If this fails,
    # someone changed annotations without regenerating/committing the spec —
    # exactly the "stale contract" bug class the frontend freshness check
    # exists to catch. Fail here, backend-side, before anything is published.
    - name: Check swagger spec has no drift
      run: |
        if ! git diff --exit-code -- docs/docs.go docs/swagger.json docs/swagger.yaml; then
          echo "::error::Generated swagger files are stale (docs.go / swagger.json / swagger.yaml). Run: swag init -g cmd/api/main.go -o docs --parseDependency --parseInternal, then commit the result."
          exit 1
        fi

    - name: Build
      run: go build -v ./cmd/api

    # Publish swagger.json as a GitHub Release asset so external consumers
    # (frontend CI) can fetch it via GitHub REST API.
    #
    # IMPORTANT: actions/upload-artifact only shares artifacts within the
    # SAME workflow run. The frontend CI CANNOT download that artifact.
    #
    # We use a static tag `swagger-latest`. Frontend fetches via:
    #   GET /repos/{owner}/{repo}/releases/tags/swagger-latest
    #   -> assets[{name: "swagger.json"}].browser_download_url
    #
    # Only pushes to main may mutate the published contract: PR runs (and
    # pushes to develop) must never change what the frontend gate compares
    # against, or the freshness check could be poisoned by unreviewed code.
    #
    # If the release already exists we only clobber the asset (no
    # delete-then-recreate window where the release 404s). If any step here
    # fails, the frontend CI's fetch will fail loudly — never silently fall
    # back to a stale committed spec.
    - name: Publish swagger-latest release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        NOTES="Auto-generated swagger spec from main @ ${GITHUB_SHA}. Consumed by frontend CI for contract freshness checks — do not pin versions to this moving release."
        if gh release view swagger-latest > /dev/null 2>&1; then
          gh release upload swagger-latest docs/swagger.json --clobber
          gh release edit swagger-latest --title "Swagger Latest" --notes "$NOTES"
        else
          gh release create swagger-latest docs/swagger.json \
            --target "$GITHUB_SHA" \
            --title "Swagger Latest" \
            --notes "$NOTES"
        fi
