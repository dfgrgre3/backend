        - count
        - sum
        - avg
        - min
        - max
        - distinct_count
        type: string
      field:
        type: string
      format:
        enum:
        - number
        - currency
        - percentage
        - date
        type: string
      name:
        type: string
    required:
    - aggregation
    - field
    - name
    type: object
  internal_infrastructure_api_handlers_protected.ReportSort:
    properties:
      direction:
