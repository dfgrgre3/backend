      eventType:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: true
        type: object
      promoId:
        type: string
      timestamp:
        type: integer
      type:
        type: string
    type: object
  internal_infrastructure_api_handlers_protected.ReportDimension:
