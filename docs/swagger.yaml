      field:
        type: string
      format:
        enum:
        - date
        - text
        - number
        type: string
      label:
        type: string
    required:
    - field
    - label
    type: object
  internal_infrastructure_api_handlers_protected.ReportFilter:
    properties:
      field:
        type: string
      operator:
        enum:
        - equals
        - not_equals
        - contains
        - greater_than
        - less_than
        - between
        - in
        type: string
      value: {}
    required:
    - field
    - operator
    - value
    type: object
  internal_infrastructure_api_handlers_protected.ReportMetric:
    properties:
      aggregation:
