basePath: /api
definitions:
  internal_infrastructure_api_handlers_protected.ConversionEventRequest:
    properties:
      goal:
        type: string
      journeySteps:
        type: integer
      sessionId:
        type: string
      timestamp:
        type: string
      userId:
        type: string
      value:
        type: number
    required:
    - goal
    - sessionId
    - timestamp
    - userId
    type: object
  internal_infrastructure_api_handlers_protected.CreateBackupRequest:
    properties:
      includesDatabase:
        type: boolean
      includesFiles:
        type: boolean
      name:
        maxLength: 100
        type: string
      retentionDays:
        maximum: 365
        minimum: 1
        type: integer
      tables:
        items:
          type: string
        type: array
      type:
        enum:
        - full
        - database
        - files
        - incremental
        type: string
    required:
    - name
    - type
    type: object
  internal_infrastructure_api_handlers_protected.CreateTicketRequest:
    properties:
      category:
        enum:
        - technical
        - billing
        - content
        - account
        - other
        type: string
      description:
        maxLength: 5000
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - urgent
        type: string
      relatedEntityId:
        type: string
      relatedEntityType:
        type: string
      subject:
        maxLength: 200
        type: string
      userId:
        type: string
    required:
    - category
    - description
    - subject
    - userId
    type: object
  internal_infrastructure_api_handlers_protected.CustomReportRequest:
    properties:
      dateRange:
        properties:
          from:
            type: string
          to:
            type: string
        type: object
      description:
        maxLength: 500
        type: string
      filters:
        items:
          $ref: '#/definitions/internal_infrastructure_api_handlers_protected.ReportFilter'
        type: array
      isPublic:
        type: boolean
      name:
        maxLength: 100
        type: string
      schedule:
        properties:
          emailTo:
            items:
              type: string
            minItems: 1
            type: array
          frequency:
            enum:
            - daily
            - weekly
            - monthly
            type: string
        required:
        - emailTo
        - frequency
        type: object
      widgets:
        items:
          $ref: '#/definitions/internal_infrastructure_api_handlers_protected.ReportWidget'
        minItems: 1
        type: array
    required:
    - name
    - widgets
    type: object
  internal_infrastructure_api_handlers_protected.MegaMenuTrackRequest:
    properties:
      component:
        description: '"mega_menu"'
        type: string
      label:
        description: menu label
        type: string
      metadata:
        additionalProperties: true
        description: 'e.g. { trigger: "toggle" }'
        type: object
      timestamp:
        description: client epoch ms
        type: integer
      type:
        description: '"open" | "close"'
        type: string
    required:
    - type
    type: object
  internal_infrastructure_api_handlers_protected.NotificationRequest:
    properties:
      actionUrl:
        type: string
      channels:
        items:
          type: string
        minItems: 1
        type: array
      message:
        maxLength: 2000
        type: string
      priority:
        enum:
        - high
        - normal
        - low
        type: string
      scheduledFor:
        type: string
      title:
        maxLength: 200
        type: string
      type:
        enum:
        - info
        - success
        - warning
        - error
        type: string
      userIds:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - channels
    - message
    - title
    - userIds
    type: object
  internal_infrastructure_api_handlers_protected.NotificationResponse:
    properties:
      broadcastId:
        type: string
      queued:
        type: boolean
      summary:
        $ref: '#/definitions/internal_infrastructure_api_handlers_protected.NotificationSummary'
    type: object
  internal_infrastructure_api_handlers_protected.NotificationSummary:
    properties:
